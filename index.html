<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GetWeatherWithAPI</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="card">
            <h1>🌤️ Get Weather</h1>
            <form id="weather-form">
                <div class="field">
                    <label for="latitude">Latitude</label>
                    <input type="number" min="-90" max="90" step="any" id="latitude" placeholder="z.B. 52.52" />
                </div>

                <div class="field">
                    <label for="longtitude">Longitude</label>
                    <input type="number" min="-180" max="180" step="any" id="longtitude" placeholder="z.B. 13.40" />
                </div>

                <button type="submit" id="submit-btn">
                    <span class="btn-text">See weather</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
                <h3>this site could not work in Russia</h3>
            </form>

            <p id="error" class="error" role="alert"></p>
            <div id="result"></div>
        </main>
    </body>
</html>
